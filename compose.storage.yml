services:
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--limit-concurrency", "64"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://shopping:local-shopping-only@postgres:5432/shopping
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: shopping
      PG_POOL_SIZE: "10"
      CHAT_MAX_INFLIGHT: "16"
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-lexical}
    ports: ["127.0.0.1::8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: local-shopping-only
      POSTGRES_DB: shopping
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - shopping_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - shopping_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  shopping_pg:
  shopping_redis:
